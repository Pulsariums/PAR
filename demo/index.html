<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAR Demo</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <strong>PAR</strong><span class="muted">Pulsar ASS Renderer - demo</span>
  </header>
  <section class="controls">
    <label>Video <input id="videoFile" type="file" accept="video/*" /></label>
    <label>Subtitle <input id="assFile" type="file" accept=".ass,.ssa,text/plain" /></label>
    <label>Region
      <select id="region">
        <option value="video">video (letterbox-aware)</option>
        <option value="container">container</option>
        <option value="custom">custom rect</option>
      </select>
    </label>
    <label class="rect">Rect <input id="rect" value="40,40,640,360" size="14" /></label>
    <label>Layout
      <select id="layout">
        <option value="script">script (PlayRes)</option>
        <option value="1920x1080">1920x1080</option>
        <option value="1280x720">1280x720</option>
        <option value="640x360">640x360</option>
        <option value="384x288">384x288</option>
      </select>
    </label>
    <label>Render FPS
      <select id="fps">
        <option value="auto">auto</option>
        <option>10</option><option>24</option><option>30</option><option>60</option><option>120</option><option>200</option>
      </select>
    </label>
    <label>Video FPS <input id="videoFps" type="number" min="0" step="0.001" placeholder="off" /></label>
    <label>Offset (s) <input id="offset" type="number" step="0.1" value="0" /></label>
    <label>Fit
      <select id="fit"><option>contain</option><option>cover</option><option>fill</option></select>
    </label>
  </section>
  <main>
    <div id="player" class="player">
      <video id="video" controls playsinline></video>
      <div id="placeholder" class="placeholder">No video loaded: rendering the sample on a virtual clock.</div>
    </div>
    <div class="clockbar" id="clockbar">
      <button id="play" type="button">Play</button>
      <input id="seek" type="range" min="0" max="30" step="0.01" value="0" />
      <span id="clockLabel">0.00 s</span>
    </div>
    <pre id="metrics" class="metrics"></pre>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
