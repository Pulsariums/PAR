<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PAR Player</title>
  <meta name="description" content="Play your own video with ASS, XPAR or PAR subtitles and your own fonts. Everything stays on your device." />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <script>
    try { var th = localStorage.getItem('par.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/watch.css" />
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="../" aria-label="PAR"><img src="../favicon.svg" alt="" width="24" height="24" /><b>PAR</b> <span class="muted" data-i18n="w.page">Player</span></a>
      <nav class="nav" aria-label="Main">
        <a href="../#convert-root" data-i18n="nav.convert">Convert</a>
        <a href="../#studio-root" data-i18n="w.lab">Lab</a>
      </nav>
      <div class="tools">
        <div class="seg" role="group" data-i18n-attr="aria-label:lang.label" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" data-lang="tr" aria-pressed="false">TR</button>
          <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        </div>
        <button type="button" class="icon-btn" id="themeBtn" data-i18n-attr="aria-label:theme.toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 12.4 3.1C12.3 3 12.1 3 12 3z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap" id="watch-root"></main>
  <script type="module" src="../src/watch/main.ts"></script>
</body>
</html>
