      <text x="100" y="340" fill="#fff" fill-opacity=".25" stroke="#000" stroke-opacity=".6" stroke-width="8" paint-order="stroke">PAR</text>
      <text x="100" y="340" fill="url(#sw)" stroke="#000" stroke-opacity=".6" stroke-width="8" paint-order="stroke" clip-path="url(#c)">PAR</text>
