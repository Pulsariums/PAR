<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">PAR - Pulsar ASS Renderer</title>
  <desc id="d">Animated banner: a karaoke sweep fills the words Pulsar ASS Renderer while a subtitle line glides across.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14112b"/><stop offset="1" stop-color="#0a1426"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <clipPath id="reveal"><rect x="190" y="110" width="0" height="130">
      <animate attributeName="width" values="0;900;900;0" keyTimes="0;.55;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="260" fill="url(#glow)"><animate attributeName="cx" values="1050;900;1050" dur="12s" repeatCount="indefinite"/></circle>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 90H1280M0 180H1280M0 270H1280M320 0V360M640 0V360M960 0V360"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800">
    <text x="640" y="82" text-anchor="middle" font-size="26" fill="#a594ff" letter-spacing="8" font-weight="700">P A R</text>
    <g font-size="96" text-anchor="middle">
      <text x="640" y="205" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#ffffff" fill-opacity=".22" stroke="#000" stroke-opacity=".6" stroke-width="6" paint-order="stroke">Pulsar ASS Renderer</text>
      <text x="640" y="205" textLength="900" lengthAdjust="spacingAndGlyphs" fill="url(#sweep)" stroke="#000" stroke-opacity=".6" stroke-width="6" paint-order="stroke" clip-path="url(#reveal)">Pulsar ASS Renderer</text>
    </g>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="600">
    <text y="300" fill="#e8e8f0" stroke="#000" stroke-width="5" paint-order="stroke" text-anchor="middle">
      ASS / SSA subtitles in plain DOM, SVG and CSS. No WebAssembly.
      <animate attributeName="x" values="-500;640;640;1780" keyTimes="0;.35;.7;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  <g fill="#a594ff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" opacity=".8">
    <text x="40" y="340">{\k50}{\move}{\t}{\clip}{\p1}</text>
  </g>
</svg>
